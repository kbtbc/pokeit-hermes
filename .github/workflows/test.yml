name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies (the proxy runs on the Hermes gateway's own FastAPI)
        run: pip install fastapi httpx
      - name: Desktop plugin tests
        run: node --experimental-vm-modules --test tests/test_desktop.mjs
      - name: Gateway proxy tests
        run: python -m unittest discover -s tests -p "test_*.py"
